# Relais TCP « fc-edge » (VPS partagé) : Nginx de Tanit Sign -> services FrigoConnect. Aucun traitement HTTP ici :
# en-têtes, Host (signature S3) et WebSocket passent tels quels ; TLS, filtrage et limites de débit sont faits par le Nginx de Tanit Sign.
events {}

stream {
  # Résolution à chaque connexion : un « docker compose up » qui recrée web/api change leur IP sans casser le relais
  resolver 127.0.0.11 valid=10s ipv6=off;

  server { listen 3000; set $u fc-web:3000;      proxy_pass $u; }
  server { listen 3001; set $u fc-api:3001;      proxy_pass $u; proxy_timeout 3600s; }   # Socket.IO : connexions longues
  server { listen 8080; set $u fc-keycloak:8080; proxy_pass $u; }
  server { listen 9000; set $u fc-minio:9000;    proxy_pass $u; proxy_timeout 300s; }
}
