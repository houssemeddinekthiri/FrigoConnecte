# Réglages communs à tous les proxys : installé dans /etc/nginx/snippets/. Aucune variable.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# ÉCRASE (et n'ajoute pas) : Nginx est le premier maillon de confiance ; une valeur envoyée par le client serait usurpable
# (limitation de débit et journaux de l'API se fient à cette adresse : « trust proxy 1 »).
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
# (délais : valeurs par défaut dans 00-frigoconnect.conf ; une « location » peut les surcharger)
