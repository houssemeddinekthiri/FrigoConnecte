# Réglages GLOBAUX (contexte http) : installé dans /etc/nginx/conf.d/. Aucune variable : copié tel quel.

server_tokens off;

# WebSocket : « upgrade » seulement si le client le demande ; sinon en-tête vide (conserve la connexion persistante vers l'amont)
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      "";
}

# Limites de débit par adresse IP (réponse 429). Valeurs modérées : un bureau derrière une seule IP ne doit pas être bloqué.
limit_req_zone $binary_remote_addr zone=site:10m    rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m   rate=5r/s;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=50r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# Amont : tout est lié à 127.0.0.1 par docker-compose (jamais exposé directement)
upstream frigo_web   { server 127.0.0.1:3000; keepalive 16; }
upstream frigo_api   { server 127.0.0.1:3001; keepalive 16; }
upstream frigo_auth  { server 127.0.0.1:8080; keepalive 8; }
upstream frigo_files { server 127.0.0.1:9000; keepalive 8; }

# Journal JSON (lisible par Loki en Phase 16). Pas de corps de requête, pas d'en-têtes d'autorisation.
log_format frigo escape=json '{"t":"$time_iso8601","ip":"$remote_addr","host":"$host","req":"$request","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"urt":"$upstream_response_time","ref":"$http_referer","ua":"$http_user_agent"}';
access_log /var/log/nginx/access.log frigo;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

# TLS : profil « intermédiaire » Mozilla (TLS 1.2 et 1.3 uniquement)
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 9.9.9.9 valid=300s;
resolver_timeout 5s;

# Délais par défaut des proxys (surchargés pour le temps réel et les fichiers)
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

client_max_body_size 1m;   # surchargé pour le stockage de fichiers
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 30s;
