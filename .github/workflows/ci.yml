name: CI

# Sur chaque pull request, et appelé par « Release » à chaque fusion sur main.
# (Pas de déclencheur « push » ici : la CI ne tournerait pas deux fois sur main.)
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Une nouvelle poussée sur la même PR annule l'exécution précédente. Les appels depuis Release ne s'annulent jamais.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Compilation et tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compile les contrats partagés et l'API (TypeScript strict)
        run: npm run build
      - name: Tests unitaires
        run: npm test
      - name: Compile le site (types + build de production)
        run: npm run build -w @frigoconnect/web
        env:
          # valeurs factices : lues à la compilation, jamais utilisées
          AUTH_SECRET: ci
          KEYCLOAK_ISSUER: http://localhost:8080/realms/frigoconnect
          KEYCLOAK_CLIENT_ID: frigoconnect-web
          API_URL: http://localhost:3001

  integration:
    name: Intégration SQL (PostGIS réel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: frigo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d frigo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Migrations réelles + scénarios de bout en bout (devis, paiements, contrats, administration, recherche géographique)
        run: npm run test:integration -w @frigoconnect/api
        env:
          TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/frigo_test

  security:
    name: Dépendances (vulnérabilités critiques)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Bloque sur « critical » uniquement (hors outils de développement) ; le reste est traité par Dependabot
      - run: npm audit --omit=dev --audit-level=critical

  smoke:
    name: Pile Docker complète
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Génère un .env jetable (secrets aléatoires)
        run: bash infra/scripts/gen-env.sh
      - name: Valide la configuration Compose
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Construit les images et démarre les 7 services
        run: docker compose up -d --build
      - name: Attend que tout soit sain
        run: bash infra/scripts/wait-healthy.sh 420 postgres redis keycloak minio api web
      - name: Test de fumée (realm Keycloak, OTP admin, stockage, PostGIS, création du premier admin)
        run: bash infra/scripts/smoke.sh
      - name: Journaux en cas d'échec
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 150 keycloak minio-init api web postgres
      - name: Nettoyage
        if: always()
        run: docker compose down -v
