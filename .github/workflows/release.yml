name: Release

# À chaque fusion sur main : CI -> images publiées (GHCR) -> staging (automatique) -> production (après validation manuelle).
# « Construire une fois, déployer partout » : l'image validée en staging est EXACTEMENT celle promue en production (même tag).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false # un déploiement commencé n'est jamais interrompu par un push suivant

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    name: Construit et publie les images (GHCR)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      prefix: ${{ steps.vars.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}" # GHCR exige des minuscules
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${owner}/frigoconnect" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.prefix }}-api:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.prefix }}-api:main
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Site
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          # Valeur VIDE : le navigateur joint le temps réel sur l'origine du site (Nginx route /socket.io).
          # Sans cela, l'image serait propre à un domaine et ne pourrait pas être promue de staging à production.
          build-args: NEXT_PUBLIC_WS_URL=
          tags: |
            ${{ steps.vars.outputs.prefix }}-web:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.prefix }}-web:main
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Analyse des images publiées : une vulnérabilité CRITIQUE avec correctif disponible bloque le déploiement
      - name: Analyse de l'image API
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.vars.outputs.prefix }}-api:${{ steps.vars.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: Analyse de l'image site
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.vars.outputs.prefix }}-web:${{ steps.vars.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  staging:
    name: Staging
    needs: images
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      tag: ${{ needs.images.outputs.tag }}
      image_prefix: ${{ needs.images.outputs.prefix }}
    secrets: inherit

  production:
    name: Production
    needs: [images, staging]
    permissions:
      contents: read
      packages: read
    # L'environnement « production » exige une validation manuelle (réviseurs requis : voir docs/CICD.md)
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      tag: ${{ needs.images.outputs.tag }}
      image_prefix: ${{ needs.images.outputs.prefix }}
    secrets: inherit
